<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Fox SVG App</title>
  <style>
    body {
      background-color: #0d0d14; /* Match the SVG's background color */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }

    .svg-container {
      width: 80%;
      max-width: 800px;
      height: auto;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <img src="assets/gamer-fox.svg" alt="Cyberpunk Gamer Fox Mascot">
  </div>
</body>
</html>
