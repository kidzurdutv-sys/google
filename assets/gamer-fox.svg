<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { filter: drop-shadow(0 0 5px #00f3ff) brightness(1); }
        50% { filter: drop-shadow(0 0 20px #00f3ff) brightness(1.3); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes blink {
        0%, 94%, 100% { transform: scaleY(1); }
        97% { transform: scaleY(0.1); }
      }
      .glow-anim {
        animation: pulse 2.5s infinite ease-in-out;
      }
      .character-bob {
        animation: bob 4s infinite ease-in-out;
        transform-origin: 50% 50%;
      }
      .eye-blink {
        animation: blink 6s infinite;
        transform-origin: 50% 380px;
      }
    </style>

    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#cc4400" />
    </linearGradient>

    <linearGradient id="furLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa64d" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="furDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e65c00" />
      <stop offset="100%" stop-color="#992600" />
    </linearGradient>

    <linearGradient id="armorDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c35" />
      <stop offset="100%" stop-color="#15151a" />
    </linearGradient>

    <linearGradient id="armorPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a00cc" />
      <stop offset="100%" stop-color="#3d0066" />
    </linearGradient>

    <linearGradient id="armorPurpleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9933ff" />
      <stop offset="100%" stop-color="#6600cc" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aaffff" />
      <stop offset="50%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0088aa" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d0d14" />

  <g class="character-bob">
    <g id="armor-collar" filter="url(#shadow)">
      <path d="M 280 580 L 520 580 L 580 750 L 220 750 Z" fill="url(#armorDark)" />
      <path d="M 260 550 Q 400 600 540 550 L 560 620 Q 400 660 240 620 Z" fill="url(#armorPurple)" />
      <path d="M 350 630 L 450 630 L 470 700 L 330 700 Z" fill="url(#armorDark)" stroke="#00f3ff" stroke-width="3" class="glow-anim" />
      <polygon points="380,650 420,650 430,680 370,680" fill="url(#cyanGlow)" class="glow-anim" />
    </g>

    <g id="ears">
      <path d="M 280 300 C 220 200 180 120 150 100 C 230 140 280 200 350 280 Z" fill="url(#furDarkGrad)" filter="url(#shadow)" />
      <path d="M 270 280 C 220 210 190 150 170 140 C 220 170 260 210 320 270 Z" fill="url(#armorPurple)" />
      <path d="M 260 260 C 220 210 200 170 190 160 C 220 180 250 220 300 260 Z" fill="#00f3ff" class="glow-anim" />

      <path d="M 520 300 C 580 200 620 120 650 100 C 570 140 520 200 450 280 Z" fill="url(#furDarkGrad)" filter="url(#shadow)" />
      <path d="M 530 280 C 580 210 610 150 630 140 C 580 170 540 210 480 270 Z" fill="url(#armorPurple)" />
      <path d="M 540 260 C 580 210 600 170 610 160 C 580 180 550 220 500 260 Z" fill="#00f3ff" class="glow-anim" />
    </g>

    <g id="fox-face" filter="url(#shadow)">
      <path d="M 400 180
               C 480 180 550 250 580 350
               C 610 450 560 520 480 550
               L 400 620
               L 320 550
               C 240 520 190 450 220 350
               C 250 250 320 180 400 180 Z"
            fill="url(#furGrad)" />

      <path d="M 400 180 L 440 280 L 400 320 L 360 280 Z" fill="url(#furLightGrad)" />
      <polygon points="400,220 420,270 400,300 380,270" fill="url(#furDarkGrad)" />

      <path d="M 220 350 C 150 400 120 450 180 470 C 190 440 210 420 250 400 Z" fill="url(#furDarkGrad)" />
      <path d="M 230 400 C 170 440 150 480 200 500 C 210 480 230 460 260 450 Z" fill="url(#furGrad)" />

      <path d="M 580 350 C 650 400 680 450 620 470 C 610 440 590 420 550 400 Z" fill="url(#furDarkGrad)" />
      <path d="M 570 400 C 630 440 650 480 600 500 C 590 480 570 460 540 450 Z" fill="url(#furGrad)" />

      <path d="M 280 420
               C 320 420 350 460 400 460
               C 450 460 480 420 520 420
               C 550 470 520 520 480 550
               L 400 620
               L 320 550
               C 280 520 250 470 280 420 Z"
            fill="#d9d9e6" />

      <path d="M 370 420 C 370 380 430 380 430 420 L 415 540 L 385 540 Z" fill="url(#furDarkGrad)" />

      <polygon points="380,540 420,540 410,570 390,570" fill="#15151a" />
      <polygon points="390,545 410,545 405,555 395,555" fill="#333344" />

      <path d="M 250 480 L 300 520" stroke="#00f3ff" stroke-width="3" fill="none" class="glow-anim" opacity="0.6"/>
      <circle cx="250" cy="480" r="3" fill="#00f3ff" class="glow-anim"/>

      <path d="M 550 480 L 500 520" stroke="#00f3ff" stroke-width="3" fill="none" class="glow-anim" opacity="0.6"/>
      <circle cx="550" cy="480" r="3" fill="#00f3ff" class="glow-anim"/>
    </g>

    <g id="glowing-eyes" class="eye-blink">
      <path d="M 270 350 L 380 380 L 370 410 L 280 390 Z" fill="#15151a" filter="url(#shadow)" />
      <path d="M 285 365 L 365 385 L 355 400 L 295 385 Z" fill="#333344" />
      <path d="M 320 375 L 350 382 L 340 395 L 325 385 Z" fill="url(#cyanGlow)" class="glow-anim" />

      <path d="M 530 350 L 420 380 L 430 410 L 520 390 Z" fill="#15151a" filter="url(#shadow)" />
      <path d="M 515 365 L 435 385 L 445 400 L 505 385 Z" fill="#333344" />
      <path d="M 480 375 L 450 382 L 460 395 L 475 385 Z" fill="url(#cyanGlow)" class="glow-anim" />

      <path d="M 250 330 L 390 360 L 390 350 L 260 310 Z" fill="url(#armorPurple)" />
      <path d="M 550 330 L 410 360 L 410 350 L 540 310 Z" fill="url(#armorPurple)" />
    </g>

    <g id="headphones" filter="url(#shadow)">
      <path d="M 160 350 C 160 100 640 100 640 350 L 600 350 C 600 140 200 140 200 350 Z" fill="url(#armorDark)" />
      <path d="M 180 350 C 180 120 620 120 620 350 L 610 350 C 610 130 190 130 190 350 Z" fill="url(#armorPurple)" />

      <path d="M 320 135 C 370 125 430 125 480 135 L 470 155 C 420 145 380 145 330 155 Z" fill="#15151a" />

      <rect x="110" y="280" width="80" height="160" rx="40" fill="url(#armorDark)" />
      <rect x="130" y="300" width="60" height="120" rx="30" fill="url(#armorPurpleLight)" />
      <path d="M 100 320 L 150 280 L 150 440 L 100 400 Z" fill="#2c2c35" />
      <path d="M 110 330 L 140 300 L 140 420 L 110 390 Z" fill="url(#armorPurple)" />
      <ellipse cx="130" cy="360" rx="10" ry="40" fill="none" stroke="#00f3ff" stroke-width="4" class="glow-anim" />

      <rect x="610" y="280" width="80" height="160" rx="40" fill="url(#armorDark)" />
      <rect x="610" y="300" width="60" height="120" rx="30" fill="url(#armorPurpleLight)" />
      <path d="M 700 320 L 650 280 L 650 440 L 700 400 Z" fill="#2c2c35" />
      <path d="M 690 330 L 660 300 L 660 420 L 690 390 Z" fill="url(#armorPurple)" />
      <ellipse cx="670" cy="360" rx="10" ry="40" fill="none" stroke="#00f3ff" stroke-width="4" class="glow-anim" />

      <path d="M 620 420 C 600 500 550 550 480 560" fill="none" stroke="url(#armorDark)" stroke-width="12" stroke-linecap="round" />
      <path d="M 620 420 C 600 500 550 550 480 560" fill="none" stroke="url(#armorPurple)" stroke-width="6" stroke-linecap="round" />
      <circle cx="470" cy="565" r="15" fill="#15151a" />
      <circle cx="470" cy="565" r="8" fill="url(#cyanGlow)" class="glow-anim" />
    </g>
  </g>
</svg>